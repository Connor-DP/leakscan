pack: secrets
version: 1

# Credentials and keys. Highest severity in the catalogue because they are live
# and directly exploitable — everything else is information, this is access.
#
# Patterns are single-quoted so backslashes stay literal.

rules:
  # -- provider key shapes: anchored, high confidence -----------------------

  - id: secret.aws_access_key_id.v1
    name: AWS access key ID
    category: secret
    subtype: aws_access_key_id
    severity: critical
    confidence: 95
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: secret.aws_secret_access_key.v1
    name: AWS secret access key
    category: secret
    subtype: aws_secret_access_key
    severity: critical
    confidence: 80
    # Too loose on its own — a 40-char base64 run is common. Anchored by the
    # variable name it almost always sits beside.
    pattern: '(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})'
    group: 1

  - id: secret.anthropic_api_key.v1
    name: Anthropic API key
    category: secret
    subtype: anthropic_api_key
    severity: critical
    confidence: 97
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}'

  - id: secret.openai_api_key.v1
    name: OpenAI API key
    category: secret
    subtype: openai_api_key
    severity: critical
    confidence: 95
    pattern: '\bsk-(?:proj-)?[A-Za-z0-9]{32,}'

  - id: secret.stripe_live_key.v1
    name: Stripe live secret key
    category: secret
    subtype: stripe_live_key
    severity: critical
    confidence: 97
    pattern: '\b(?:sk|rk)_live_[A-Za-z0-9]{20,}'

  - id: secret.stripe_webhook_secret.v1
    name: Stripe webhook signing secret
    category: secret
    subtype: stripe_webhook_secret
    severity: high
    confidence: 95
    pattern: '\bwhsec_[A-Za-z0-9]{20,}'

  - id: secret.github_token.v1
    name: GitHub token
    category: secret
    subtype: github_pat
    severity: critical
    confidence: 96
    pattern: '\b(?:ghp|gho|ghs|ghu|ghr)_[A-Za-z0-9]{30,}|\bgithub_pat_[A-Za-z0-9_]{30,}'

  - id: secret.slack_token.v1
    name: Slack token
    category: secret
    subtype: slack_bot_token
    severity: high
    confidence: 95
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}'

  - id: secret.slack_webhook.v1
    name: Slack incoming webhook
    category: secret
    subtype: slack_webhook_url
    severity: high
    confidence: 95
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9/]+'

  - id: secret.supabase_access_token.v1
    name: Supabase access token
    category: secret
    subtype: supabase_access_token
    severity: critical
    confidence: 95
    pattern: '\bsbp_[a-f0-9]{40}\b'

  - id: secret.google_api_key.v1
    name: Google API key
    category: secret
    subtype: google_api_key
    severity: high
    confidence: 92
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'

  - id: secret.google_oauth_secret.v1
    name: Google OAuth client secret
    category: secret
    subtype: google_oauth_secret
    severity: critical
    confidence: 95
    pattern: '\bGOCSPX-[A-Za-z0-9_-]{20,}'

  - id: secret.mailgun_api_key.v1
    name: Mailgun API key
    category: secret
    subtype: mailgun_api_key
    severity: high
    confidence: 92
    pattern: '\bkey-[a-f0-9]{32}\b'

  - id: secret.sendgrid_api_key.v1
    name: SendGrid API key
    category: secret
    subtype: sendgrid_api_key
    severity: high
    confidence: 95
    pattern: '\bSG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'

  - id: secret.airtable_token.v1
    name: Airtable personal access token
    category: secret
    subtype: airtable_token
    severity: high
    confidence: 90
    pattern: '\bpat[A-Za-z0-9]{14}\.[a-f0-9]{64}\b'

  - id: secret.npm_token.v1
    name: npm access token
    category: secret
    subtype: npm_token
    severity: high
    confidence: 93
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'

  - id: secret.sentry_dsn.v1
    name: Sentry DSN with key
    category: secret
    subtype: sentry_dsn
    severity: medium
    confidence: 90
    pattern: 'https://[a-f0-9]{16,}@[a-z0-9.-]*(?:ingest\.)?sentry\.io/[0-9]+'

  # -- generic shapes -------------------------------------------------------

  - id: secret.service_role_jwt.v1
    name: JWT granting service_role
    category: secret
    subtype: service_role_jwt
    severity: critical
    confidence: 90
    # The payload segment of a service_role token base64-encodes the string
    # "service_role", which survives as this fragment.
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*c2VydmljZV9yb2xl[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{8,}'

  - id: secret.jwt.v1
    name: JSON Web Token
    category: secret
    subtype: jwt
    severity: high
    confidence: 75
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{8,}'

  - id: secret.private_key_pem.v1
    name: Private key
    category: secret
    subtype: private_key_pem
    severity: critical
    confidence: 99
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'

  - id: secret.database_url.v1
    name: Database connection string with credentials
    category: secret
    subtype: database_connection_string
    severity: critical
    confidence: 95
    pattern: '\b(?:postgres|postgresql|mysql|mongodb|mongodb\+srv|redis|amqp)://[^:\s/]+:[^@\s]+@[^\s"'']+'

  - id: secret.bearer_token.v1
    name: Bearer token in a request header
    category: secret
    subtype: bearer_token
    severity: high
    confidence: 80
    pattern: '(?i)authorization\s*:\s*bearer\s+([A-Za-z0-9._-]{20,})'
    group: 1

  - id: secret.basic_auth_url.v1
    name: Credentials embedded in a URL
    category: secret
    subtype: basic_auth_url
    severity: high
    confidence: 88
    pattern: 'https?://[^:/\s]+:[^@/\s]{4,}@[^\s"'']+'

  - id: secret.presigned_url.v1
    name: Pre-signed URL carrying a token
    category: secret
    subtype: presigned_url
    severity: medium
    confidence: 85
    pattern: 'https?://[^\s"'']*[?&](?:X-Amz-Signature|X-Goog-Signature|sig|sv)=[A-Za-z0-9%/+=_-]{16,}'

  - id: secret.env_assignment.v1
    name: Secret-shaped environment assignment
    category: secret
    subtype: env_assignment
    severity: high
    confidence: 70
    # The catch-all for in-house names. The value must not look like a
    # placeholder, which the noise pack handles.
    pattern: '(?im)^[ \t>]*(?:export\s+)?[A-Z][A-Z0-9_]*(?:SECRET|PASSWORD|PASSWD|TOKEN|API_?KEY|PRIVATE_?KEY|CREDENTIAL)[A-Z0-9_]*\s*[:=]\s*["'']?([^\s"''#]{8,})'
    group: 1

  - id: secret.high_entropy_string.v1
    name: High-entropy string near a secret-shaped name
    category: secret
    subtype: high_entropy_string
    severity: medium
    confidence: 45
    # Deliberately low confidence: this is the net for token formats nobody has
    # written a rule for. Both an entropy floor and nearby context are required,
    # or it fires on hashes, IDs and base64 payloads all day.
    pattern: '\b[A-Za-z0-9+/_-]{32,}\b'
    min_entropy: 4.2
    requires_context:
      - key
      - token
      - secret
      - password
      - credential
      - auth
      - bearer
